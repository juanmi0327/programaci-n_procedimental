<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Contabilidad</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-menu">
        <div class="navbar-start">
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link"> Más opciones </a>

            <div class="navbar-dropdown">
              <a class="navbar-item" href="../index.html">Inicio</a>
              <a class="navbar-item" href="contabilidad.html">Contabilidad</a>
              <a class="navbar-item" href="inventario.html">Inventario</a>
              <a class="navbar-item" href="menu.html">Menú</a>
              <a class="navbar-item" href="pedidos.html">Pedidos</a>
              <a class="navbar-item" href="usuario.html">Usuario</a>
              <a class="navbar-item" href="quienessomos.html">Quienes somos</a>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <section class="section">
      <div class="container">
        <h1 class="title has-text-centered">Contabilidad</h1>

        <div class="columns is-centered is-vcentered mt-5">
          <div class="column has-text-centered">
            <figure class="image is-128x128 is-inline-block">
              <img
                class="is-rounded"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqVg_URh9Mvrm3NYaTlCUyiM7r382ohELc1g&s"
                alt="Foto del Usuario"
              />
            </figure>

            <h3 class="title is-4 mt-3">Nombre de usuario</h3>
          </div>

          <div class="column">
            <div class="box">
                <div class="field">
                  <div class="control">
                    <input class="input" id="ventas" type="text" placeholder="Ventas" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="fecha" type="date" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="ingresos" type="text" placeholder="Ingresos" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="egresos" type="text" placeholder="Egresos" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="concepto" type="text" placeholder="Concepto" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="valor" type="text" placeholder="Valor" />
                  </div>
                </div>

                <div class="field is-grouped mt-5">
                  <div class="control">
                    <button class="button is-success is-dark is-rounded" id="enviar">
                      Enviar
                    </button>
                  </div>
                  <div class="control">
                    <button class="button is-primary is-dark is-rounded" id="cancelar">
                      Cancelar
                    </button>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/contabilidad.js"></script>
  </body>
</html>
