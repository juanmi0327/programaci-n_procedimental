<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Inventario</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-menu">
        <div class="navbar-start">
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link"> Más opciones </a>

            <div class="navbar-dropdown">
              <a class="navbar-item" href="../index.html">Inicio</a>
              <a class="navbar-item" href="contabilidad.html">Contabilidad</a>
              <a class="navbar-item" href="inventario.html">Inventario</a>
              <a class="navbar-item" href="menu.html">Menú</a>
              <a class="navbar-item" href="pedidos.html">Pedidos</a>
              <a class="navbar-item" href="usuario.html">Usuario</a>
              <a class="navbar-item" href="quienessomos.html">Quienes somos</a>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <section class="section">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-half">
            <div class="card">
              <div class="card-content">
                <div class="media">
                  <div class="media-content">
                    <center><p class="title is-4">Inventario</p></center>
                  </div>
                </div>

                <form id="inventarioForm" class="section">
                  <div class="field">
                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        id="codigo_producto"
                        name="codigo_producto"
                        placeholder="Código del producto"
                        required
                      />
                    </div>
                  </div>

                  <div class="field">
                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        id="nombre_producto"
                        name="nombre_producto"
                        placeholder="Nombre del producto"
                        required
                      />
                    </div>
                  </div>

                  <div class="field">
                    <div class="control">
                      <input
                        class="input"
                        type="number"
                        id="cantidad"
                        name="cantidad"
                        placeholder="cantidad"
                        required
                      />
                    </div>
                  </div>

                  <div class="field">
                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        id="marca_producto"
                        name="marca_producto"
                        placeholder="Marca del producto"
                        required
                      />
                    </div>
                  </div>

                  <div class="field">
                    <div class="control">
                      <button
                        type="submit"
                        class="button is-success is-dark is-rounded"
                      >
                        Guardar
                      </button>
                    </div>
                    <div class="control">
                      <button
                        type="reset"
                        class="button is-primary is-dark is-rounded"
                      >
                        Cancelar
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
