<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Registro</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-menu">
        <div class="navbar-start">
          <div class="navbar-item has-dropdown is-hoverable">
            <a class="navbar-link"> Más opciones </a>
            <div class="navbar-dropdown">
              <a class="navbar-item" href="../index.html">Inicio</a>
              <a class="navbar-item" href="contabilidad.html">Contabilidad</a>
              <a class="navbar-item" href="inventario.html">Inventario</a>
              <a class="navbar-item" href="menu.html">Menú</a>
              <a class="navbar-item" href="pedidos.html">Pedidos</a>
              <a class="navbar-item" href="usuario.html">Usuario</a>
              <a class="navbar-item" href="quienessomos.html">Quienes somos</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <h1 class="title has-text-centered">Registro de Usuario</h1>

        <div class="columns is-centered">
          <div class="column is-half">
            <div class="box">
                <div class="field">
                  <div class="control">
                    <input class="input" id="nombre_usuario" type="text" placeholder="Nombre" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="apellido" type="text" placeholder="Apellido" />
                  </div>
                </div>

                <div class="field">
                  <label class="label">Tipo de documento</label>
                  <div class="control">
                    <div class="select">
                      <select id="documento">
                        <option>Cédula de Ciudadanía (CC)</option>
                        <option>Tarjeta de Identidad (TI)</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="num_doc" type="number" placeholder="Documento" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="telefono" type="number" placeholder="Teléfono" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input class="input" id="correo" type="email" placeholder="Correo" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <label class="label">Género</label>
                    <label class="radio">
                      <input type="radio" name="genero" id="gen_fem" />
                      Femenino
                    </label>
                    <label class="radio">
                      <input type="radio" name="genero" id="gen_mas" />
                      Masculino
                    </label>
                    <label class="radio">
                      <input type="radio" name="genero" id="gen_otro" />
                      Otro
                    </label>
                  </div>
                </div>

                <div class="field">
                  <label class="label">Cargo</label>
                  <div class="control">
                    <div class="select">
                      <select id="cargo">
                        <option>Usuario</option>
                        <option>Administrador</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="field">
                  <label class="label">Fecha de nacimiento</label>
                  <div class="control">
                    <input class="input" type="date" id="fecha_nacimi" placeholder="Fecha" />
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="contrasena"
                      placeholder="Contraseña"
                    />
                  </div>
                </div>

                <div class="field is-grouped">
                  <div class="control">
                    <button class="button is-success is-dark is-rounded" id="enviar">
                      Enviar
                    </button>
                  </div>
                  <div class="control">
                    <button class="button is-primary is-dark is-rounded" id="cancelar">
                      Cancelar
                    </button>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/usuario.js"></script>
  </body>
</html>
